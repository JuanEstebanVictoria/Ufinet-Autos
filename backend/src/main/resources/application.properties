# ==========================================================
# Backend Configuration for Autos Challenge
# ==========================================================

# 1. General Application Settings
spring.application.name=autos-backend

# 2. Database Configuration — SQL Server (Azure SQL Edge via Docker)
# Secrets are read from environment variables first.
# The value after ':' is the local development fallback — never use these in production.
# In production/CI, set: DB_HOST, DB_NAME, DB_USER, DB_PASSWORD as env vars.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:autos_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Uf1net@2024!}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# H2 Configuration (disabled — uncomment to use for quick testing)
# spring.datasource.url=jdbc:h2:mem:autosdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# 3. ORM and Persistence Layer (JPA / Hibernate)
# Schema is managed by database_script.sql — Hibernate should NOT touch DDL.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

# JWT Configuration
# In production, set JWT_SECRET as an environment variable (min 256-bit / 32 chars recommended).
jwt.secret=${JWT_SECRET:ufinet-autos-super-secret-key-do-not-use-in-production-2024}
