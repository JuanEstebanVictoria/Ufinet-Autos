<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>{{ isEditMode ? 'Edit' : 'Add' }} Auto</h2>
      
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form [formGroup]="autoForm" (ngSubmit)="onSubmit()">

        <!-- Brand -->
        <div class="mb-3">
          <label class="form-label">Brand</label>
          <input type="text" formControlName="brand" class="form-control"
            [ngClass]="{'is-invalid': autoForm.get('brand')?.invalid && autoForm.get('brand')?.touched}">
          <div class="invalid-feedback" *ngIf="autoForm.get('brand')?.touched && autoForm.get('brand')?.errors?.['required']">
            Brand is required.
          </div>
        </div>

        <!-- Model -->
        <div class="mb-3">
          <label class="form-label">Model</label>
          <input type="text" formControlName="model" class="form-control"
            [ngClass]="{'is-invalid': autoForm.get('model')?.invalid && autoForm.get('model')?.touched}">
          <div class="invalid-feedback" *ngIf="autoForm.get('model')?.touched && autoForm.get('model')?.errors?.['required']">
            Model is required.
          </div>
        </div>

        <!-- Year -->
        <div class="mb-3">
          <label class="form-label">Year</label>
          <input type="number" formControlName="year" class="form-control"
            [ngClass]="{'is-invalid': autoForm.get('year')?.invalid && autoForm.get('year')?.touched}">
          <div class="invalid-feedback" *ngIf="autoForm.get('year')?.touched">
            <span *ngIf="autoForm.get('year')?.errors?.['required']">Year is required.</span>
            <span *ngIf="autoForm.get('year')?.errors?.['min']">Year must be 1900 or later.</span>
          </div>
        </div>

        <!-- License Plate -->
        <div class="mb-3">
          <label class="form-label">License Plate</label>
          <input type="text" formControlName="licensePlate" class="form-control"
            [ngClass]="{'is-invalid': autoForm.get('licensePlate')?.invalid && autoForm.get('licensePlate')?.touched}">
          <div class="invalid-feedback" *ngIf="autoForm.get('licensePlate')?.touched">
            <span *ngIf="autoForm.get('licensePlate')?.errors?.['required']">License plate is required.</span>
            <span *ngIf="autoForm.get('licensePlate')?.errors?.['pattern']">Only uppercase letters, numbers and hyphens allowed.</span>
          </div>
        </div>

        <!-- Color -->
        <div class="mb-3">
          <label class="form-label">Color</label>
          <input type="text" formControlName="color" class="form-control"
            [ngClass]="{'is-invalid': autoForm.get('color')?.invalid && autoForm.get('color')?.touched}">
          <div class="invalid-feedback" *ngIf="autoForm.get('color')?.touched && autoForm.get('color')?.errors?.['required']">
            Color is required.
          </div>
        </div>

        <button type="submit" class="btn btn-success" [disabled]="autoForm.invalid">Save</button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/">Cancel</button>
      </form>
    </div>
  </div>
</div>
